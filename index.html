<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact Us</title>
<meta name="theme-color" content="#0f2b2e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,650&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     EDIT ME — every visible piece of content is set from CONFIG
     below in the <script> at the bottom of this file. You do not
     need to touch this <style> block or the HTML/JS structure at
     all unless you want to change the look.
     ============================================================ */

  :root{
    --ink:#0f2b2e;         /* deep teal-ink background          */
    --ink-2:#143a3d;       /* slightly lighter panel tone        */
    --brass:#e3a857;       /* warm brass accent — primary        */
    --brass-dim:#c98f43;
    --parchment:#f4efe4;   /* warm off-white text                */
    --parchment-dim:#c9c2b3;
    --stamp:#8c3b3b;       /* muted stamp-red, used sparingly     */
    --radius:14px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(120% 90% at 50% -10%, rgba(227,168,87,0.14), transparent 60%),
      var(--ink);
    color:var(--parchment);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:36px 16px 60px;
  }

  /* V561: removed a decorative fade-in animation on body that was here —
     it risked getting stuck at its opacity:0 starting keyframe in some
     mobile WebView/iframe contexts (exactly the "page renders as a solid
     blank rectangle" symptom), for a purely cosmetic 0.5s flourish. Not
     worth the risk. */

  .ticket{
    width:100%;
    max-width:400px;
    position:relative;
  }

  /* torn/perforated top edge — the page's one signature element:
     it reads visually as the top of the paper receipt the person
     just scanned, continuing straight into their phone screen. */
  .perf{
    height:14px;
    background:
      radial-gradient(circle at 10px 0, transparent 7px, var(--ink) 7.5px) top/20px 14px repeat-x;
    position:relative;
    top:1px;
  }

  .card{
    background:var(--ink-2);
    border-radius:0 0 var(--radius) var(--radius);
    padding:30px 26px 26px;
    box-shadow:0 24px 48px rgba(0,0,0,0.35);
  }

  .langswitch{
    display:flex;
    justify-content:center;
    gap:6px;
    margin-bottom:16px;
  }
  .langswitch button{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.05em;
    background:none;
    border:1px solid rgba(244,239,228,0.2);
    color:var(--parchment-dim);
    border-radius:20px;
    padding:3px 10px;
    cursor:pointer;
  }
  .langswitch button.active{
    color:var(--ink);
    background:var(--brass);
    border-color:var(--brass);
  }

  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--brass);
    text-align:center;
    margin:0 0 14px;
  }

  .logo{
    display:block;
    width:76px;height:76px;
    border-radius:50%;
    object-fit:cover;
    margin:0 auto 14px;
    border:2px solid var(--brass);
  }

  h1{
    font-family:'Fraunces',serif;
    font-weight:650;
    font-size:clamp(26px,7vw,32px);
    text-align:center;
    margin:0 0 6px;
    line-height:1.15;
  }

  .tagline{
    text-align:center;
    color:var(--parchment-dim);
    font-size:14px;
    margin:0 0 24px;
  }

  .dashline{
    border:none;
    border-top:1.5px dashed rgba(244,239,228,0.22);
    margin:0 0 22px;
  }

  .links{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .btn{
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    padding:14px 16px;
    border-radius:10px;
    border:1.5px solid rgba(244,239,228,0.14);
    background:rgba(244,239,228,0.03);
    color:var(--parchment);
    text-decoration:none;
    font-size:15px;
    font-weight:600;
    transition:transform .12s ease, background .12s ease, border-color .12s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn:hover{background:rgba(244,239,228,0.07);border-color:rgba(244,239,228,0.28);}

  .btn.primary{
    background:var(--brass);
    border-color:var(--brass);
    color:var(--ink);
  }
  .btn.primary:hover{background:var(--brass-dim);border-color:var(--brass-dim);}

  .btn .ic{flex:0 0 auto;display:flex;}
  .btn .lbl{flex:1;text-align:left;}
  html[dir="rtl"] .btn .lbl{text-align:right;}

  .footer{
    text-align:center;
    margin-top:24px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.05em;
    color:rgba(244,239,228,0.35);
  }

  .footer .stamp{
    display:inline-block;
    margin-top:8px;
    padding:3px 10px;
    border:1px solid var(--stamp);
    color:var(--stamp);
    border-radius:20px;
    font-size:10px;
    transform:rotate(-2deg);
  }

  .empty-state{
    text-align:center;
    color:var(--parchment-dim);
    font-size:13.5px;
    padding:18px 4px 4px;
    line-height:1.7;
  }
</style>
</head>
<body>

  <div class="ticket">
    <div class="card">
      <div class="langswitch" id="langSwitch"></div>
      <p class="eyebrow" id="eyebrow">Follow Us</p>
      <img class="logo" id="logoImg" src="" alt="" style="display:none;">
      <h1 id="storeName">Your Store</h1>
      <p class="tagline" id="tagline"></p>
      <hr class="dashline">
      <div class="links" id="linksContainer"></div>
      <div class="footer">
        DJAREK POS
        <div class="stamp">Scan &amp; Connect</div>
      </div>
    </div>
    <div class="perf" style="transform:rotate(180deg);top:-1px;"></div>
  </div>

<script>
/* ============================================================
   EDIT ME — fill in your store's info below, then upload this
   whole file to any free static host (GitHub Pages, Netlify,
   Vercel, Cloudflare Pages...) and paste the resulting URL into
   DJAREK POS -> Settings -> Store Info -> "Store Links Page URL".
   Leave any field empty ('') to hide its button automatically.
   Store name / tagline can be set per language below.
   ============================================================ */
var CONFIG = {
  "language": "en",
  "storeName": "DJAREK",
  "tagline": "Thanks for visiting! Find us here",
  "logoUrl": "",
  "primaryColor": "#7B2FBE",
  "whatsapp": "0559236633",
  "phone": "0559236633",
  "email": "",
  "address": "",
  "facebook": "Facebook.com/djarek ",
  "instagram": "Instagram.com/djarek ",
  "tiktok": "tiktok.com/@djarek"
};
/* ============================================================
   No need to edit anything below this line
   ============================================================ */

var TEXT = {
  en: {
    eyebrow: 'Follow Us', whatsapp: 'Message us on WhatsApp', call: 'Call us',
    instagram: 'Follow on Instagram', facebook: 'Follow on Facebook', tiktok: 'Follow on TikTok',
    email: 'Email us', address: 'View on map',
    empty: 'No links added yet.<br>Open this file and edit the <code>CONFIG</code> object above.'
  },
  fr: {
    eyebrow: 'Suivez-nous', whatsapp: 'Contactez-nous sur WhatsApp', call: 'Appelez-nous',
    instagram: 'Suivre sur Instagram', facebook: 'Suivre sur Facebook', tiktok: 'Suivre sur TikTok',
    email: 'Envoyer un e-mail', address: 'Voir sur la carte',
    empty: 'Aucun lien ajouté pour le moment.<br>Ouvrez ce fichier et modifiez l\'objet <code>CONFIG</code> ci-dessus.'
  }
};

var ICONS = {
  whatsapp: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.7-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6.1-.1.3-.3.4-.5.1-.1.2-.3.3-.4.1-.2 0-.4 0-.5C10 9 9.4 7.6 9.1 7c-.2-.5-.4-.5-.6-.5h-.5c-.2 0-.5.1-.7.3-.3.3-1 1-1 2.4s1 2.8 1.2 3c.1.2 2 3.1 4.9 4.3.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.7-.7 1.9-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.6-.3z"/><path d="M12 2C6.5 2 2 6.4 2 12c0 1.9.5 3.6 1.4 5.1L2 22l5.1-1.3c1.4.8 3.1 1.2 4.9 1.2 5.5 0 10-4.4 10-10S17.5 2 12 2zm0 18.2c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3.3.9.9-3.2-.2-.3C3.9 14.7 3.5 13.4 3.5 12c0-4.7 3.8-8.5 8.5-8.5s8.5 3.8 8.5 8.5-3.8 8.5-8.5 8.5z"/></svg>',
  phone: '<svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8c1.4 2.7 3.6 4.9 6.3 6.3l2.1-2.1c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.6c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.3 1L6.6 10.8z"/></svg>',
  email: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>',
  address: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>',
  facebook: '<svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0 0 22 12z"/></svg>',
  instagram: '<svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c2.7 0 3.1 0 4.1.1 1.1 0 1.8.2 2.5.5.7.3 1.2.6 1.8 1.2.6.6.9 1.1 1.2 1.8.3.7.4 1.4.5 2.5 0 1 .1 1.4.1 4.1s0 3.1-.1 4.1c0 1.1-.2 1.8-.5 2.5-.3.7-.6 1.2-1.2 1.8-.6.6-1.1.9-1.8 1.2-.7.3-1.4.4-2.5.5-1 0-1.4.1-4.1.1s-3.1 0-4.1-.1c-1.1 0-1.8-.2-2.5-.5-.7-.3-1.2-.6-1.8-1.2-.6-.6-.9-1.1-1.2-1.8-.3-.7-.4-1.4-.5-2.5 0-1-.1-1.4-.1-4.1s0-3.1.1-4.1c0-1.1.2-1.8.5-2.5.3-.7.6-1.2 1.2-1.8.6-.6 1.1-.9 1.8-1.2.7-.3 1.4-.4 2.5-.5C8.9 2 9.3 2 12 2zm0 1.8c-2.7 0-3 0-4 .1-.9 0-1.4.2-1.7.3-.4.2-.7.3-1 .6-.3.3-.5.6-.6 1-.1.3-.3.8-.3 1.7-.1 1-.1 1.3-.1 4s0 3 .1 4c0 .9.2 1.4.3 1.7.2.4.3.7.6 1 .3.3.6.5 1 .6.3.1.8.3 1.7.3 1 .1 1.3.1 4 .1s3 0 4-.1c.9 0 1.4-.2 1.7-.3.4-.2.7-.3 1-.6.3-.3.5-.6.6-1 .1-.3.3-.8.3-1.7.1-1 .1-1.3.1-4s0-3-.1-4c0-.9-.2-1.4-.3-1.7-.2-.4-.3-.7-.6-1-.3-.3-.6-.5-1-.6-.3-.1-.8-.3-1.7-.3-1-.1-1.3-.1-4-.1zm0 3.5a4.7 4.7 0 1 1 0 9.4 4.7 4.7 0 0 1 0-9.4zm0 1.8a2.9 2.9 0 1 0 0 5.8 2.9 2.9 0 0 0 0-5.8zm5-2a1.1 1.1 0 1 1-2.2 0 1.1 1.1 0 0 1 2.2 0z"/></svg>',
  tiktok: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M14 2h2.7c.2 1.2.9 2.3 1.9 3.1a5.4 5.4 0 0 0 3 1.2v2.8a8.2 8.2 0 0 1-4.5-1.4v6.6a6.5 6.5 0 1 1-6.5-6.5c.3 0 .6 0 .9.1v2.9a3.7 3.7 0 1 0 2.6 3.5V2z"/></svg>'
};

var currentLang = CONFIG.language || 'en';

// If a primaryColor was passed in (DJAREK POS injects its own Appearance ->
// Primary Color when generating this file), use it as the accent instead of
// the default brass tone, so the page matches the store's brand color.
function _shade(hex, amt) {
  try {
    var c = hex.replace('#', '');
    if (c.length === 3) c = c[0]+c[0]+c[1]+c[1]+c[2]+c[2];
    var num = parseInt(c, 16);
    var r = Math.max(0, Math.min(255, (num >> 16) + amt));
    var g = Math.max(0, Math.min(255, ((num >> 8) & 0xff) + amt));
    var b = Math.max(0, Math.min(255, (num & 0xff) + amt));
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  } catch (e) { return hex; }
}
try {
  if (CONFIG.primaryColor) {
    document.documentElement.style.setProperty('--brass', CONFIG.primaryColor);
    document.documentElement.style.setProperty('--brass-dim', _shade(CONFIG.primaryColor, -25));
  }
} catch (e) { /* non-critical, keep default colors */ }

function el(tag, attrs, html){
  var e = document.createElement(tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  if (html !== undefined) e.innerHTML = html;
  return e;
}

function addBtn(container, href, icon, label, primary){
  var a = el('a', { href: href, target: '_blank', rel: 'noopener' }, '');
  a.className = 'btn' + (primary ? ' primary' : '');
  a.innerHTML = '<span class="ic">' + icon + '</span><span class="lbl">' + label + '</span>';
  container.appendChild(a);
}

function pick(field) {
  // fields can be a plain string (same in every language) or an
  // { en: '...', fr: '...' } object.
  if (field && typeof field === 'object') return field[currentLang] || field.en || '';
  return field || '';
}

function render(){
  var T = TEXT[currentLang] || TEXT.en;

  document.documentElement.lang = currentLang;
  document.documentElement.dir = 'ltr'; // en + fr are both LTR

  var name = pick(CONFIG.storeName) || 'Your Store';
  document.title = name;
  document.getElementById('storeName').textContent = name;
  document.getElementById('eyebrow').textContent = T.eyebrow;

  var tag = document.getElementById('tagline');
  var taglineText = pick(CONFIG.tagline);
  if (taglineText) { tag.textContent = taglineText; tag.style.display = ''; }
  else { tag.style.display = 'none'; }

  if (CONFIG.logoUrl) {
    var img = document.getElementById('logoImg');
    img.src = CONFIG.logoUrl;
    img.alt = name;
    img.style.display = 'block';
  }

  var wrap = document.getElementById('linksContainer');
  wrap.innerHTML = '';
  var any = false;

  if (CONFIG.whatsapp) {
    var digits = String(CONFIG.whatsapp).replace(/[^0-9]/g, '');
    if (digits) { addBtn(wrap, 'https://wa.me/' + digits, ICONS.whatsapp, T.whatsapp, true); any = true; }
  }
  if (CONFIG.phone) { addBtn(wrap, 'tel:' + CONFIG.phone.replace(/\s+/g, ''), ICONS.phone, T.call); any = true; }
  if (CONFIG.instagram) { addBtn(wrap, CONFIG.instagram, ICONS.instagram, T.instagram); any = true; }
  if (CONFIG.facebook)  { addBtn(wrap, CONFIG.facebook,  ICONS.facebook,  T.facebook); any = true; }
  if (CONFIG.tiktok)    { addBtn(wrap, CONFIG.tiktok,    ICONS.tiktok,    T.tiktok); any = true; }
  if (CONFIG.email)     { addBtn(wrap, 'mailto:' + CONFIG.email, ICONS.email, T.email); any = true; }
  if (CONFIG.address) {
    // Accept either a plain address (wrapped into a Maps search query) or a
    // Maps link/any URL the owner already copied from Google Maps "Share" —
    // used as-is so it opens the exact pinned location instead of a re-search.
    var addressHref = /^https?:\/\//i.test(CONFIG.address.trim())
      ? CONFIG.address.trim()
      : 'https://maps.google.com/?q=' + encodeURIComponent(CONFIG.address);
    addBtn(wrap, addressHref, ICONS.address, T.address);
    any = true;
  }

  if (!any) {
    wrap.appendChild(el('div', { class: 'empty-state' }, T.empty));
  }

  var sw = document.getElementById('langSwitch');
  sw.innerHTML = '';
  ['en', 'fr'].forEach(function(l){
    var b = el('button', {}, l.toUpperCase());
    if (l === currentLang) b.className = 'active';
    b.onclick = function(){ currentLang = l; render(); };
    sw.appendChild(b);
  });
}

try {
  render();
} catch (e) {
  // V561: surface the error visibly instead of a silent blank page — a
  // blank iframe with no clue what broke was reported and impossible to
  // diagnose remotely. If you see this, whatever text follows is the exact
  // problem.
  document.body.innerHTML =
    '<div style="max-width:400px;margin:40px auto;padding:20px;background:#fff;' +
    'border:2px solid #ef4444;border-radius:12px;font-family:monospace;font-size:13px;' +
    'color:#991b1b;white-space:pre-wrap;word-break:break-word;">' +
    '<b>Store Links page failed to render:</b>\n\n' + (e && e.message ? e.message : String(e)) +
    '</div>';
}
</script>
</body>
</html>
